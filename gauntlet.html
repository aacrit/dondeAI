<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donde Gauntlet — Search Quality Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0d0f;
      --surface: #16181c;
      --surface-2: #1e2028;
      --surface-3: #262830;
      --border: #2e3038;
      --border-focus: #454854;
      --text: #d4d5d9;
      --text-2: #7c7f8a;
      --text-3: #52545e;
      --accent: #8b8ff5;
      --accent-dim: rgba(139,143,245,0.12);
      --rag-green: #34d399;
      --rag-amber: #f0a63a;
      --rag-red: #ef6461;
      --info: #6b9fff;
      --radius: 8px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --font-mono: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px;
      max-width: 1440px;
      margin: 0 auto;
    }

    h1 { font-size: 1.3rem; font-weight: 700; }
    h2 { font-size: 1rem; font-weight: 600; margin: 0 0 14px; color: var(--text); }
    h3 { font-size: 0.88rem; font-weight: 600; margin: 0 0 10px; color: var(--text); }

    .subtitle { font-size: 0.78rem; color: var(--text-2); margin-top: 2px; }

    /* ─── Header ──────────────────────────────────────────── */
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    #run-selector {
      padding: 5px 10px;
      font-size: 0.75rem;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--font);
      min-width: 260px;
      transition: border-color 0.15s;
    }
    #run-selector:hover { border-color: var(--accent); }
    #run-selector:focus { border-color: var(--accent); outline: none; }

    .refresh-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-2);
      padding: 7px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--font);
      font-size: 0.75rem;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .refresh-btn:hover { border-color: var(--border-focus); color: var(--text); }

    /* ─── Tabs ────────────────────────────────────────────── */
    .tab-bar {
      display: flex;
      gap: 2px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .tab {
      padding: 11px 20px;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-2);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
      white-space: nowrap;
      user-select: none;
      border-radius: 6px 6px 0 0;
    }
    .tab:hover { color: var(--text); background: var(--surface); }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); background: var(--surface); }
    .tab-content { display: none; animation: tabFadeIn 0.25s ease-out; }
    .tab-content.active { display: block; }
    @keyframes tabFadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* ─── Summary Cards ───────────────────────────────────── */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
      transition: border-color 0.2s, transform 0.15s;
    }
    .card:hover {
      border-color: var(--border-focus);
      transform: translateY(-1px);
    }

    .card-value {
      font-size: 1.8rem;
      font-weight: 700;
      line-height: 1.2;
      font-family: var(--font-mono);
      color: var(--text);
    }

    .card-label {
      font-size: 0.68rem;
      color: var(--text-2);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 6px;
    }

    .card-value.rag-green { color: var(--rag-green); }
    .card-value.rag-amber { color: var(--rag-amber); }
    .card-value.rag-red { color: var(--rag-red); }

    /* ─── Recommendation Cards ────────────────────────────── */
    .rec-list { margin-bottom: 20px; }
    .rec-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .rec-card:hover { background: var(--surface-2); border-left-color: var(--accent); }
    .rec-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .rec-priority {
      font-size: 0.62rem;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: var(--accent-dim);
      padding: 2px 6px;
      border-radius: 3px;
    }
    .rec-action { font-size: 0.82rem; font-weight: 500; color: var(--text); }
    .rec-detail { display: flex; gap: 16px; font-size: 0.72rem; margin-top: 4px; }
    .rec-impact { color: var(--rag-green); }
    .rec-rationale { color: var(--text-2); flex: 1; }

    /* ─── Tables ──────────────────────────────────────────── */
    .table-wrap { overflow-x: auto; margin-bottom: 16px; border-radius: var(--radius); }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
    }

    tbody tr { transition: background 0.15s; }
    tbody tr:hover { background: var(--surface-2); }

    th, td {
      padding: 8px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      background: var(--surface);
      color: var(--text-2);
      font-weight: 600;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tr:hover td { background: var(--surface); }
    tr.expandable { cursor: pointer; }
    tr.expandable:hover td { background: var(--surface-2); }

    .dm-cell {
      font-weight: 600;
      text-align: center;
      width: 50px;
      font-family: var(--font-mono);
      font-size: 0.78rem;
    }

    .dm-cell.rag-green { color: var(--rag-green); }
    .dm-cell.rag-amber { color: var(--rag-amber); }
    .dm-cell.rag-red { color: var(--rag-red); }

    /* Sortable */
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { color: var(--text); }
    th.sortable::after { content: ' \2195'; font-size: 0.6rem; opacity: 0.3; }
    th.sortable.asc::after { content: ' \2191'; opacity: 0.8; }
    th.sortable.desc::after { content: ' \2193'; opacity: 0.8; }

    /* ─── Score Distribution ──────────────────────────────── */
    .dist-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .dist-label {
      font-size: 0.7rem;
      width: 130px;
      text-align: right;
      color: var(--text-2);
      flex-shrink: 0;
    }

    .dist-bar-track {
      flex: 1;
      height: 18px;
      background: var(--surface-2);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .dist-bar {
      height: 100%;
      border-radius: 3px;
      min-width: 2px;
      transition: width 0.5s ease;
      display: flex;
      align-items: center;
      padding: 0 6px;
      font-size: 0.65rem;
      font-weight: 600;
      font-family: var(--font-mono);
      color: var(--bg);
    }

    .dist-count {
      font-size: 0.68rem;
      color: var(--text-2);
      font-family: var(--font-mono);
      width: 30px;
      text-align: right;
      flex-shrink: 0;
    }

    .dist-pct {
      font-size: 0.65rem;
      color: var(--text-3);
      width: 40px;
      flex-shrink: 0;
    }

    .percentile-markers {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 0.7rem;
    }
    .percentile-markers span { color: var(--text-2); }
    .percentile-markers strong { color: var(--text); font-family: var(--font-mono); }

    /* ─── Gap Badge ───────────────────────────────────────── */
    .badge {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 3px;
      font-size: 0.65rem;
      font-weight: 600;
    }

    .badge-p0 { background: rgba(239,100,97,0.15); color: var(--rag-red); }
    .badge-p1 { background: rgba(240,166,58,0.15); color: var(--rag-amber); }
    .badge-p2 { background: rgba(107,159,255,0.12); color: var(--info); }
    .badge-auto { background: rgba(52,211,153,0.12); color: var(--rag-green); }
    .badge-tuning { background: rgba(240,166,58,0.12); color: var(--rag-amber); }
    .badge-architectural { background: rgba(107,159,255,0.12); color: var(--info); }

    /* ─── Filter Bar ──────────────────────────────────────── */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-bar label { font-size: 0.7rem; color: var(--text-2); }
    .filter-select, .filter-input {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 8px;
      border-radius: 5px;
      font-size: 0.72rem;
      font-family: var(--font);
    }
    .filter-select:focus, .filter-input:focus { border-color: var(--accent); outline: none; }
    .filter-input { width: 180px; }
    .filter-count { font-size: 0.7rem; color: var(--text-3); margin-left: auto; }

    /* ─── Section ─────────────────────────────────────────── */
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 14px;
      transition: border-color 0.2s;
    }
    .section:hover { border-color: var(--border-focus); }

    .section h3 { margin-top: 0; }

    .section-note {
      font-size: 0.72rem;
      color: var(--text-2);
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      line-height: 1.6;
    }

    .section-note strong { color: var(--text); }

    /* ─── Grid Layout ─────────────────────────────────────── */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 900px) {
      .grid-3 { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .grid-2 { grid-template-columns: 1fr; }
      .cards { grid-template-columns: repeat(3, 1fr); }
      body { padding: 12px; }
    }

    /* ─── Factor Bars ─────────────────────────────────────── */
    .factor-bars { margin: 8px 0; }
    .factor-row {
      display: grid;
      grid-template-columns: 80px 1fr 36px;
      gap: 6px;
      align-items: center;
      margin-bottom: 3px;
    }
    .factor-label { font-size: 0.68rem; color: var(--text-2); text-align: right; }
    .factor-track {
      height: 5px;
      background: var(--surface-2);
      border-radius: 3px;
      overflow: hidden;
    }
    .factor-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s ease;
    }
    .factor-value {
      font-size: 0.68rem;
      color: var(--text-2);
      font-family: var(--font-mono);
    }

    /* ─── Collapsible ─────────────────────────────────────── */
    .collapsible { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 6px; overflow: hidden; }
    .collapsible-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      cursor: pointer;
      user-select: none;
      background: var(--surface);
      transition: background 0.15s;
      font-size: 0.8rem;
      font-weight: 500;
    }
    .collapsible-header:hover { background: var(--surface-2); }
    .collapsible-chevron { color: var(--text-3); font-size: 0.7rem; transition: transform 0.2s; }
    .collapsible.open .collapsible-chevron { transform: rotate(90deg); }
    .collapsible-body { display: none; padding: 12px 14px; border-top: 1px solid var(--border); background: var(--bg); }
    .collapsible.open .collapsible-body { display: block; }

    /* ─── Expanded Gap Row ────────────────────────────────── */
    .gap-detail-row td { background: var(--surface) !important; padding: 10px 14px; }
    .gap-detail-content { font-size: 0.72rem; color: var(--text-2); line-height: 1.6; }
    .gap-detail-content strong { color: var(--text); }
    .gap-detail-factors { display: flex; gap: 12px; margin-top: 6px; }
    .gap-detail-factors span { font-family: var(--font-mono); font-size: 0.68rem; }

    /* ─── Fix Prompt Buttons ─────────────────────────────── */
    .fix-btn {
      background: rgba(107,159,255,0.08);
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 0.7rem;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .fix-btn:hover { background: var(--accent); color: var(--bg); }
    .fix-btn.copied { background: var(--rag-green); color: #fff; border-color: var(--rag-green); }
    .fix-session-link {
      color: #fff;
      text-decoration: underline;
      font-weight: 600;
      cursor: pointer;
      pointer-events: auto;
    }
    .fix-session-link:hover { opacity: 0.85; }
    .clear-btn {
      background: transparent;
      color: var(--text-3);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .clear-btn:hover { color: var(--text); border-color: var(--text-3); }
    .bulk-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: var(--surface-2);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      margin-bottom: 8px;
      font-size: 0.75rem;
    }
    .gap-check { accent-color: var(--accent); cursor: pointer; }
    tr.gap-selected > td { background: rgba(107,159,255,0.06) !important; }
    .trend-charts { display: flex; gap: 16px; flex-wrap: wrap; }
    .trend-chart { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; }
    .trend-label { font-size: 0.68rem; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 4px; }
    .gap-sparkline { margin-top: 8px; min-height: 0; }
    .gap-sparkline svg { display: block; }
    .gap-sparkline .sparkline-label { font-size: 0.62rem; color: var(--text-3); margin-bottom: 2px; }

    /* ─── Impact Chart ────────────────────────────────────── */
    .impact-row {
      display: grid;
      grid-template-columns: 120px 1fr 100px 80px;
      gap: 8px;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.75rem;
    }
    .impact-row:last-child { border-bottom: none; }
    .impact-type { font-weight: 500; }
    .impact-bar-track {
      height: 8px;
      background: var(--surface-2);
      border-radius: 4px;
      overflow: hidden;
    }
    .impact-bar {
      height: 100%;
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    /* ─── Stat Grid ───────────────────────────────────────── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 8px;
    }
    .stat-item { text-align: center; padding: 10px; background: var(--surface-2); border-radius: var(--radius); }
    .stat-value { font-size: 1.1rem; font-weight: 600; font-family: var(--font-mono); color: var(--text); }
    .stat-label { font-size: 0.62rem; color: var(--text-3); text-transform: uppercase; margin-top: 2px; }

    /* ─── Loading & Error ─────────────────────────────────── */
    .loading { text-align: center; padding: 80px; color: var(--text-2); }
    .loading-spinner {
      width: 24px; height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: var(--rag-red); text-align: center; padding: 60px; }

    /* ─── Gap severity dots ────────────────────────────────── */
    .severity-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px;
    }
    .severity-dot.p0 { background: var(--rag-red); }
    .severity-dot.p1 { background: var(--rag-amber); }
    .severity-dot.p2 { background: var(--text-3); }

    /* ─── Score badge ──────────────────────────────────────── */
    .dm-badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px; font-weight: 600;
      font-family: var(--font-mono); font-size: 0.75rem;
    }
    .dm-badge.rag-green { background: rgba(52,211,153,0.12); color: var(--rag-green); }
    .dm-badge.rag-amber { background: rgba(240,166,58,0.12); color: var(--rag-amber); }
    .dm-badge.rag-red { background: rgba(239,100,97,0.12); color: var(--rag-red); }
  </style>
</head>
<body>

<div style="background:#8b8ff5;padding:10px 20px;text-align:center;font-size:0.82rem;font-family:'Inter',sans-serif;">
  This dashboard has moved. <a href="command-center.html" style="color:#fff;font-weight:600;text-decoration:underline;">Open the new Command Center &rarr;</a>
</div>

<header>
  <div style="flex:1">
    <h1>Donde Gauntlet — Command Center</h1>
    <div id="header-meta" style="display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap;">
      <select id="run-selector" style="padding:5px 10px;font-size:0.75rem;background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-family:var(--font);min-width:260px;">
        <option value="">Loading runs...</option>
      </select>
      <div id="run-badges" style="display:flex;gap:6px;align-items:center;"></div>
    </div>
  </div>
  <button class="refresh-btn" id="refresh-btn">Refresh</button>
</header>

<div id="app">
  <div class="loading">
    <div class="loading-spinner"></div>
    <p>Loading dashboard data...</p>
  </div>
</div>

<script type="module">
/* ── Auth Gate ────────────────────────────────────────────────────────────── */
const SUPABASE_URL = 'https://vwbzkgsxmgwcvmvuxnbe.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3YnprZ3N4bWd3Y3ZtdnV4bmJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5NjUzNTYsImV4cCI6MjA4NTU0MTM1Nn0.YBhmusYxc28TD5FOZv4TBpFpDVHHk1V894wUkNtJtcc';
const ADMIN_EMAIL = 'aacrit@gmail.com';

async function checkAuth() {
  const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data: { session } } = await sb.auth.getSession();
  if (session?.user?.email === ADMIN_EMAIL) {
    loadData();
  } else {
    showAccessDenied(sb, session);
  }
}

function showAccessDenied(sb, session) {
  const app = document.getElementById('app');
  document.getElementById('run-selector').innerHTML = '<option>Admin access required</option>';
  const msg = session
    ? `Signed in as ${session.user.email} — you don't have admin access.`
    : 'Sign in with your Google account to continue.';
  app.innerHTML = `<div style="text-align:center;padding:80px 20px;">
    <h2 style="color:var(--rag-red);margin-bottom:12px;">Access Denied</h2>
    <p style="color:var(--text-2);margin-bottom:24px;font-size:0.85rem;">${msg}</p>
    <button id="admin-sign-in-btn" style="
      background:var(--surface);border:1px solid var(--border);color:var(--text);
      padding:10px 20px;border-radius:6px;cursor:pointer;font-family:var(--font);font-size:0.8rem;
    ">${session ? 'Sign in with a different account' : 'Sign in with Google'}</button>
  </div>`;
  document.getElementById('admin-sign-in-btn').addEventListener('click', async () => {
    if (session) await sb.auth.signOut();
    await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } });
  });
}

/* ── Helpers ──────────────────────────────────────────────────────────────── */
const DATA_URLS = ['data/dashboard-data.json', '../dondeBackend/tests/gauntlet-results/dashboard-data.json'];

function ragClass(dm) {
  if (dm >= 80) return 'rag-green';
  if (dm >= 60) return 'rag-amber';
  return 'rag-red';
}

function ragColor(dm) {
  if (dm >= 80) return 'var(--rag-green)';
  if (dm >= 60) return 'var(--rag-amber)';
  return 'var(--rag-red)';
}

function pct(n, d) { return d === 0 ? '0' : (n / d * 100).toFixed(1); }
function r1(n) { return Math.round(n * 10) / 10; }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function factorColor(v) {
  if (v >= 7) return 'var(--rag-green)';
  if (v >= 5) return 'var(--rag-amber)';
  return 'var(--rag-red)';
}

/* ── Data Loading ─────────────────────────────────────────────────────────── */
let dashData = null;
let gapDetailsData = null;
let gapDetailsLoaded = false;

async function loadData() {
  const app = document.getElementById('app');
  // Try Supabase first — auto-select latest run
  try {
    const loaded = await loadRunSelector();
    if (loaded) return; // Successfully loaded latest run from Supabase
  } catch (_) {}
  // Fallback: load from local JSON
  let data = null;
  for (const url of DATA_URLS) {
    try { const r = await fetch(url); if (r.ok) { data = await r.json(); break; } } catch (_) {}
  }
  if (!data) {
    app.innerHTML = `<div class="error"><p>Could not load dashboard data.</p>
      <p style="font-size:0.75rem;margin-top:8px;color:var(--text-2)">Run: <code>./tests/gauntlet.sh --tier 1 --sample 50</code></p></div>`;
    return;
  }
  dashData = data;
  updateRunBadges(data.summary);
  renderDashboard(app, data);
}

function updateRunBadges(summary) {
  const badges = document.getElementById('run-badges');
  if (!badges || !summary) return;
  const avgDM = summary.avg_dm || 0;
  const passRate = summary.total > 0 ? Math.round(summary.passed60 / summary.total * 100) : 0;
  badges.innerHTML = `
    <span style="font-size:0.7rem;padding:3px 8px;border-radius:4px;background:var(--surface-2);color:var(--text-2);font-family:var(--font-mono);">${summary.total} queries</span>
    <span style="font-size:0.7rem;padding:3px 8px;border-radius:4px;background:var(--surface-2);color:${ragColor(avgDM)};font-family:var(--font-mono);">DM ${avgDM}</span>
    <span style="font-size:0.7rem;padding:3px 8px;border-radius:4px;background:var(--surface-2);color:${passRate >= 80 ? 'var(--rag-green)' : 'var(--rag-amber)'};font-family:var(--font-mono);">${passRate}% pass</span>
    <span style="font-size:0.7rem;padding:3px 8px;border-radius:4px;background:var(--surface-2);color:${summary.gap_count > 50 ? 'var(--rag-red)' : 'var(--rag-amber)'};font-family:var(--font-mono);">${summary.gap_count} gaps</span>
  `;
}

async function loadRunSelector() {
  try {
    const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data: runs } = await sb
      .from('gauntlet_runs')
      .select('run_id, total, gap_count, avg_dm, created_at, mode, dataset_size')
      .order('created_at', { ascending: false })
      .limit(20);
    if (!runs || runs.length === 0) return false;

    const sel = document.getElementById('run-selector');
    sel.innerHTML = '';
    for (let i = 0; i < runs.length; i++) {
      const r = runs[i];
      const date = new Date(r.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      const latest = i === 0 ? ' (latest)' : '';
      sel.innerHTML += `<option value="${r.run_id}">${r.total}q | DM ${r.avg_dm} | ${r.gap_count} gaps — ${date}${latest}</option>`;
    }
    sel.addEventListener('change', () => { if (sel.value) loadRunFromSupabase(sel.value); });
    // Auto-load the latest run
    sel.value = runs[0].run_id;
    await loadRunFromSupabase(runs[0].run_id);
    return true;
  } catch (e) {
    console.error('loadRunSelector error:', e);
    return false;
  }
}

async function loadRunFromSupabase(runId) {
  const app = document.getElementById('app');
  document.getElementById('run-badges').innerHTML = '<span style="font-size:0.7rem;color:var(--text-3)">Loading...</span>';

  try {
    const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Fetch run summary
    const { data: runData } = await sb
      .from('gauntlet_runs')
      .select('*')
      .eq('run_id', runId)
      .single();
    if (!runData) throw new Error('Run not found');

    // Fetch all results
    const { data: results } = await sb
      .from('gauntlet_results')
      .select('*')
      .eq('run_id', runId)
      .order('donde_match', { ascending: true });
    if (!results) throw new Error('No results');

    // Build dashboard-data.json shape from Supabase data
    const total = runData.total;
    const passed60 = runData.passed_60;
    const passed80 = runData.passed_80;
    const passed90 = runData.passed_90 || 0;
    const avgDM = Number(runData.avg_dm);

    // Category stats
    const catStats = runData.category_stats || {};
    const categories = {};
    for (const [cat, s] of Object.entries(catStats)) {
      categories[cat] = {
        total: s.total, avg_dm: s.avg_dm, pass_rate_60: s.pass_rate, gap_count: s.gaps,
        excellence_rate: 0, weak_rate: 0, stddev: 0, p25: 0, p50: 0, p75: 0,
        factor_averages: { food: 0, vibe: 0, service: 0, reputation: 0, convenience: 0 },
        gap_type_breakdown: {},
      };
    }

    // Build per-category factor averages and gap breakdowns from results
    const catAcc = {};
    for (const r of results) {
      const cat = r.category || 'unknown';
      if (!catAcc[cat]) catAcc[cat] = { sumF: 0, sumV: 0, sumS: 0, sumR: 0, sumC: 0, n: 0, gaps: {} };
      catAcc[cat].sumF += Number(r.food || 0);
      catAcc[cat].sumV += Number(r.vibe || 0);
      catAcc[cat].sumS += Number(r.service || 0);
      catAcc[cat].sumR += Number(r.reputation || 0);
      catAcc[cat].sumC += Number(r.convenience || 0);
      catAcc[cat].n++;
      if (r.gap_type) catAcc[cat].gaps[r.gap_type] = (catAcc[cat].gaps[r.gap_type] || 0) + 1;
    }
    for (const [cat, acc] of Object.entries(catAcc)) {
      if (categories[cat]) {
        categories[cat].factor_averages = {
          food: Math.round(acc.sumF / acc.n * 10) / 10,
          vibe: Math.round(acc.sumV / acc.n * 10) / 10,
          service: Math.round(acc.sumS / acc.n * 10) / 10,
          reputation: Math.round(acc.sumR / acc.n * 10) / 10,
          convenience: Math.round(acc.sumC / acc.n * 10) / 10,
        };
        categories[cat].gap_type_breakdown = acc.gaps;
      }
    }

    // Relevance types
    const relevanceTypes = {};
    for (const r of results) {
      const rt = r.relevance_type || 'unknown';
      relevanceTypes[rt] = (relevanceTypes[rt] || 0) + 1;
    }

    // Gap types
    const gapTypeCounts = {};
    const gapTypeImpact = {};
    for (const r of results) {
      if (!r.gap_type) continue;
      gapTypeCounts[r.gap_type] = (gapTypeCounts[r.gap_type] || 0) + 1;
      if (!gapTypeImpact[r.gap_type]) gapTypeImpact[r.gap_type] = { count: 0, sumDM: 0 };
      gapTypeImpact[r.gap_type].count++;
      gapTypeImpact[r.gap_type].sumDM += r.donde_match;
    }

    const gapImpact = {};
    const fixabilityMap = { intent: 'auto', scoring: 'tuning', relevance_ceiling: 'architectural', db_coverage: 'auto' };
    for (const [gt, info] of Object.entries(gapTypeImpact)) {
      const avgGapDM = info.sumDM / info.count;
      gapImpact[gt] = {
        count: info.count,
        avg_dm: Math.round(avgGapDM * 10) / 10,
        fixability: fixabilityMap[gt] || 'tuning',
        projected_dm_gain: Math.round((60 - avgGapDM) * info.count / total * 10) / 10,
        projected_pass_rate_gain: Math.round(info.count / total * 100 * 10) / 10,
      };
    }

    // All gaps
    const allGaps = results
      .filter(r => r.gap_type)
      .map(r => ({
        query: r.query, dm: r.donde_match, gap_type: r.gap_type,
        gap_severity: r.gap_severity || 'P2', category: r.category,
        restaurant: r.restaurant_name, impact_score: 0,
        fix_action: r.gap_type === 'intent' ? 'Add keyword to intent-classifier-v5.ts dictionaries'
          : r.gap_type === 'scoring' ? 'Review weight profiles — potential tuning needed for this query pattern'
          : 'Analyze relevance multiplier for this category',
        food: Number(r.food), vibe: Number(r.vibe), service: Number(r.service),
        reputation: Number(r.reputation), convenience: Number(r.convenience),
      }));

    // Tiers
    const tierNames = { 1: 'Must-Visit', 2: 'Neighborhood Gem', 3: 'Solid Option' };
    const tierAcc = {};
    for (const r of results) {
      const t = r.tier || 0;
      if (!tierAcc[t]) tierAcc[t] = { total: 0, sumDM: 0, pass60: 0, pass80: 0, gaps: 0 };
      tierAcc[t].total++;
      tierAcc[t].sumDM += r.donde_match;
      if (r.donde_match >= 60) tierAcc[t].pass60++;
      if (r.donde_match >= 80) tierAcc[t].pass80++;
      if (r.gap_type) tierAcc[t].gaps++;
    }
    const tiers = {};
    for (const [t, acc] of Object.entries(tierAcc)) {
      tiers[t] = {
        name: tierNames[t] || `Tier ${t}`, total: acc.total,
        avg_dm: Math.round(acc.sumDM / acc.total * 10) / 10,
        pass_rate_60: Math.round(acc.pass60 / acc.total * 100),
        excellence_rate: Math.round(acc.pass80 / acc.total * 100),
        gap_count: acc.gaps,
      };
    }

    // Score distribution
    const buckets = [
      { label: '90-100', min: 90, max: 100 }, { label: '80-89', min: 80, max: 89 },
      { label: '70-79', min: 70, max: 79 }, { label: '60-69', min: 60, max: 69 },
      { label: '50-59', min: 50, max: 59 }, { label: '40-49', min: 40, max: 49 },
      { label: '30-39', min: 30, max: 39 }, { label: '0-29', min: 0, max: 29 },
    ];
    const scoreDist = buckets.map(b => ({
      label: b.label,
      count: results.filter(r => r.donde_match >= b.min && r.donde_match <= b.max).length,
    }));

    // DM values for statistics
    const dmVals = results.map(r => r.donde_match).sort((a, b) => a - b);
    const percentile = (arr, p) => arr[Math.floor(arr.length * p)] || 0;
    const mean = dmVals.reduce((a, b) => a + b, 0) / dmVals.length;
    const variance = dmVals.reduce((s, v) => s + (v - mean) ** 2, 0) / dmVals.length;

    const data = {
      generated: runData.created_at,
      source: `Supabase: ${runId}`,
      summary: {
        total, successful: total, passed60, passed80, passed90,
        avg_dm: avgDM, gap_count: runData.gap_count,
        avg_response_ms: runData.avg_response_ms || 0,
        mode: runData.mode,
      },
      statistics: {
        min: dmVals[0] || 0, max: dmVals[dmVals.length - 1] || 0,
        p25: percentile(dmVals, 0.25), p50: percentile(dmVals, 0.5), p75: percentile(dmVals, 0.75), p95: percentile(dmVals, 0.95),
        stddev: Math.round(Math.sqrt(variance) * 10) / 10,
      },
      factor_averages: runData.factor_averages || {},
      tiers,
      categories,
      gap_types: gapTypeCounts,
      gap_impact: gapImpact,
      relevance_types: relevanceTypes,
      recommendations: [],
      all_gaps: allGaps,
      score_distribution: scoreDist,
      run_history: null,
    };

    dashData = data;
    historyLoaded = false;
    updateRunBadges(data.summary);
    renderDashboard(app, data);
  } catch (e) {
    const app = document.getElementById('app');
    app.innerHTML = `<div class="error"><p>Failed to load run: ${e.message}</p></div>`;
  }
}

async function loadGapDetails() {
  if (gapDetailsLoaded) return gapDetailsData;
  gapDetailsLoaded = true;
  for (const base of ['data/', '../dondeBackend/tests/gauntlet-results/']) {
    try {
      const r = await fetch(base + 'gap-details.json');
      if (r.ok) { gapDetailsData = await r.json(); return gapDetailsData; }
    } catch (_) {}
    if (dashData?.gap_details_file) {
      try {
        const r = await fetch(base + dashData.gap_details_file);
        if (r.ok) { gapDetailsData = await r.json(); return gapDetailsData; }
      } catch (_) {}
    }
  }
  return null;
}

/* ── Main Render ──────────────────────────────────────────────────────────── */
function renderDashboard(el, data) {
  const s = data.summary;
  const stats = data.statistics || {};
  const recs = data.recommendations || [];
  const gapImpact = data.gap_impact || {};
  const allGaps = data.all_gaps || data.top_gaps || [];
  allGapsRef = allGaps;

  let html = '';

  // ─── Tab Bar ─────────────────────────────────────────────────────────
  html += `<div class="tab-bar">
    <div class="tab active" data-tab="overview">Overview</div>
    <div class="tab" data-tab="categories">Categories</div>
    <div class="tab" data-tab="gaps">Gaps (${allGaps.length})</div>
    <div class="tab" data-tab="analysis">Analysis</div>
    <div class="tab" data-tab="history">History</div>
  </div>`;

  // ─── OVERVIEW TAB ────────────────────────────────────────────────────
  html += '<div class="tab-content active" data-tab="overview">';

  // Summary Cards
  html += '<div class="cards">';
  html += mkCard(s.total, 'Queries', '');
  html += mkCard(s.avg_dm, 'Avg DM', ragClass(s.avg_dm));
  html += mkCard(pct(s.passed60, s.total) + '%', 'Pass ≥60', s.passed60/s.total >= 0.8 ? 'rag-green' : 'rag-amber');
  html += mkCard(pct(s.passed80, s.total) + '%', 'Excel ≥80', '');
  html += mkCard(s.gap_count, 'Gaps', s.gap_count > 50 ? 'rag-red' : s.gap_count > 20 ? 'rag-amber' : '');
  if (stats.p50 !== undefined) html += mkCard(stats.p50, 'Median DM', ragClass(stats.p50));
  if (stats.stddev !== undefined) html += mkCard(stats.stddev, 'Std Dev', '');
  html += mkCard(s.mode === 'lightweight' ? 'LW' : 'Full', 'Mode', '');
  html += '</div>';

  // Grid: Score Distribution + Gap Impact
  html += '<div class="grid-2">';

  // Score Distribution
  html += '<div class="section"><h3>Score Distribution</h3>';
  const maxCount = Math.max(...data.score_distribution.map(b => b.count));
  const distColors = ['var(--rag-green)', 'var(--rag-green)', 'var(--rag-green)', 'var(--rag-amber)', 'var(--rag-amber)', 'var(--rag-red)', 'var(--rag-red)'];
  for (const [i, bucket] of data.score_distribution.entries()) {
    const w = maxCount > 0 ? (bucket.count / maxCount * 100) : 0;
    html += `<div class="dist-row">
      <span class="dist-label">${bucket.label}</span>
      <div class="dist-bar-track"><div class="dist-bar" style="width:${Math.max(w, 1)}%;background:${distColors[i]}">${bucket.count > 0 ? bucket.count : ''}</div></div>
      <span class="dist-count">${bucket.count}</span>
      <span class="dist-pct">${pct(bucket.count, s.total)}%</span>
    </div>`;
  }
  if (stats.p25 !== undefined) {
    html += `<div class="percentile-markers">
      <span>P25: <strong>${stats.p25}</strong></span>
      <span>P50: <strong>${stats.p50}</strong></span>
      <span>P75: <strong>${stats.p75}</strong></span>
      <span>P95: <strong>${stats.p95}</strong></span>
      <span>Range: <strong>${stats.min}–${stats.max}</strong></span>
    </div>`;
  }
  html += '</div>';

  // Gap Impact Analysis
  html += '<div class="section"><h3>Gap Impact & ROI</h3>';
  if (Object.keys(gapImpact).length > 0) {
    const sortedImpact = Object.entries(gapImpact).sort((a,b) => b[1].projected_pass_rate_gain - a[1].projected_pass_rate_gain);
    const maxGain = Math.max(...sortedImpact.map(([,v]) => v.projected_pass_rate_gain), 1);
    for (const [type, imp] of sortedImpact) {
      const w = (imp.projected_pass_rate_gain / maxGain * 100);
      const badgeClass = imp.fixability === 'auto' ? 'badge-auto' : imp.fixability === 'tuning' ? 'badge-tuning' : 'badge-architectural';
      html += `<div class="impact-row">
        <span class="impact-type">${type}</span>
        <div class="impact-bar-track"><div class="impact-bar" style="width:${Math.max(w, 2)}%;background:${ragColor(imp.avg_dm)}"></div></div>
        <span style="font-size:0.7rem;font-family:var(--font-mono)">+${imp.projected_pass_rate_gain}% pass</span>
        <span class="badge ${badgeClass}">${imp.fixability}</span>
      </div>`;
    }
    // Cumulative narrative
    let cumDM = 0;
    let cumPass = 0;
    const narrative = sortedImpact.map(([type, imp]) => {
      cumDM += imp.projected_dm_gain;
      cumPass += imp.projected_pass_rate_gain;
      return `Fix ${type} (${imp.count}): +${r1(cumPass)}% cumulative`;
    }).join(' → ');
    html += `<div class="section-note">${narrative}</div>`;
  } else {
    html += '<p style="color:var(--text-2);font-size:0.78rem">No gap impact data</p>';
  }
  html += '</div>';
  html += '</div>'; // grid-2

  // Tier Performance
  html += '<div class="section"><h3>Tier Performance</h3><div class="table-wrap">';
  html += '<table id="tier-table"><thead><tr>';
  html += '<th class="sortable" data-col="0" data-type="num">Tier</th>';
  html += '<th>Name</th>';
  html += '<th class="sortable" data-col="2" data-type="num">Queries</th>';
  html += '<th class="sortable" data-col="3" data-type="num">Avg DM</th>';
  html += '<th class="sortable" data-col="4" data-type="num">Pass ≥60</th>';
  html += '<th class="sortable" data-col="5" data-type="num">Excel ≥80</th>';
  html += '<th class="sortable" data-col="6" data-type="num">Gaps</th>';
  html += '</tr></thead><tbody>';
  for (const [tier, t] of Object.entries(data.tiers).sort((a,b) => Number(a[0]) - Number(b[0]))) {
    html += `<tr>
      <td>${tier}</td><td>${t.name}</td><td>${t.total}</td>
      <td class="dm-cell ${ragClass(t.avg_dm)}">${t.avg_dm}</td>
      <td>${t.pass_rate_60}%</td><td>${t.excellence_rate}%</td><td>${t.gap_count}</td>
    </tr>`;
  }
  html += '</tbody></table></div></div>';

  html += '</div>'; // end overview tab

  // ─── CATEGORIES TAB ──────────────────────────────────────────────────
  html += '<div class="tab-content" data-tab="categories">';
  html += '<div class="section"><h3>Category Performance</h3><div class="table-wrap">';
  html += '<table id="cat-table"><thead><tr>';
  html += '<th class="sortable" data-col="0" data-type="str">Category</th>';
  html += '<th class="sortable" data-col="1" data-type="num">Queries</th>';
  html += '<th class="sortable" data-col="2" data-type="num">Avg DM</th>';
  html += '<th class="sortable" data-col="3" data-type="num">Pass ≥60</th>';
  html += '<th class="sortable" data-col="4" data-type="num">Excel ≥80</th>';
  html += '<th class="sortable" data-col="5" data-type="num">Weak</th>';
  html += '<th class="sortable" data-col="6" data-type="num">Gaps</th>';
  html += '<th>Median</th><th>StdDev</th>';
  html += '</tr></thead><tbody>';
  const sortedCats = Object.entries(data.categories).sort((a,b) => a[1].avg_dm - b[1].avg_dm);
  for (const [cat, c] of sortedCats) {
    html += `<tr>
      <td><strong>${cat}</strong></td><td>${c.total}</td>
      <td class="dm-cell ${ragClass(c.avg_dm)}">${c.avg_dm}</td>
      <td>${c.pass_rate_60}%</td><td>${c.excellence_rate}%</td>
      <td style="color:${c.weak_rate > 10 ? 'var(--rag-red)' : 'inherit'}">${c.weak_rate}%</td>
      <td>${c.gap_count}</td>
      <td style="font-family:var(--font-mono);font-size:0.72rem">${c.p50 ?? '—'}</td>
      <td style="font-family:var(--font-mono);font-size:0.72rem;color:var(--text-2)">${c.stddev ?? '—'}</td>
    </tr>`;
  }
  html += '</tbody></table></div></div>';

  // Per-category deep dives
  for (const [cat, c] of sortedCats) {
    html += `<div class="collapsible" data-cat="${cat}">
      <div class="collapsible-header">
        <span><strong>${cat}</strong> — ${c.total} queries, avg ${c.avg_dm} DM</span>
        <span class="collapsible-chevron">&#9654;</span>
      </div>
      <div class="collapsible-body">`;

    // Factor averages
    if (c.factor_averages) {
      html += '<h3>Factor Performance</h3>';
      html += '<div class="factor-bars">';
      for (const [f, v] of Object.entries(c.factor_averages)) {
        const w = (v / 10 * 100);
        html += `<div class="factor-row">
          <span class="factor-label">${f}</span>
          <div class="factor-track"><div class="factor-fill" style="width:${w}%;background:${factorColor(v)}"></div></div>
          <span class="factor-value">${v}</span>
        </div>`;
      }
      html += '</div>';
    }

    // Gap type breakdown
    if (c.gap_type_breakdown && Object.keys(c.gap_type_breakdown).length > 0) {
      html += '<h3 style="margin-top:12px">Gap Breakdown</h3>';
      html += '<div style="display:flex;gap:12px;flex-wrap:wrap">';
      for (const [gt, count] of Object.entries(c.gap_type_breakdown).sort((a,b) => b[1] - a[1])) {
        const fix = gapImpact[gt]?.fixability || 'manual';
        html += `<div style="font-size:0.72rem;color:var(--text-2)"><strong style="color:var(--text)">${count}</strong> ${gt} <span class="badge badge-${fix}" style="margin-left:2px">${fix}</span></div>`;
      }
      html += '</div>';
    }

    // Percentile info
    if (c.p25 !== undefined) {
      html += `<div class="percentile-markers" style="margin-top:12px">
        <span>P25: <strong>${c.p25}</strong></span>
        <span>P50: <strong>${c.p50}</strong></span>
        <span>P75: <strong>${c.p75}</strong></span>
      </div>`;
    }

    // Category recommendation
    const catRec = recs.find(r => r.section === 'categories' && r.action.toLowerCase().includes(cat));
    if (catRec) {
      html += `<div class="section-note" style="margin-top:10px"><strong>Recommendation:</strong> ${esc(catRec.action)} — ${esc(catRec.rationale)}</div>`;
    }

    html += '</div></div>';
  }

  html += '</div>'; // end categories tab

  // ─── GAPS TAB ────────────────────────────────────────────────────────
  html += '<div class="tab-content" data-tab="gaps">';

  // Filter bar

function deltaCell(val, invert) {
  if (val === null || val === undefined) return '<td style="color:var(--text-3)">—</td>';
  const positive = invert ? val < 0 : val > 0;
  const negative = invert ? val > 0 : val < 0;
  const color = positive ? 'var(--rag-green)' : negative ? 'var(--rag-red)' : 'var(--text-3)';
  const prefix = val > 0 ? '+' : '';
  return `<td style="color:${color};font-weight:500;font-family:var(--font-mono)">${prefix}${val}</td>`;
}

function renderTrendChart(data, key, label, maxVal) {
  if (!data || data.length < 2) return '';
  const W = 280, H = 100, PAD = 24;
  const plotW = W - PAD * 2, plotH = H - PAD * 2;
  const n = data.length;
  const max = maxVal || Math.max(...data.map(d => d[key] || 0)) * 1.1;

  let points = '';
  let dots = '';
  for (let i = 0; i < n; i++) {
    const x = PAD + (i / Math.max(n - 1, 1)) * plotW;
    const y = PAD + plotH - ((data[i][key] || 0) / max) * plotH;
    points += `${x},${y} `;
    const color = key === 'gap_count' ? 'var(--rag-amber)' : ragClass(data[i][key]) === 'rag-green' ? 'var(--rag-green)' : ragClass(data[i][key]) === 'rag-amber' ? 'var(--rag-amber)' : 'var(--rag-red)';
    dots += `<circle cx="${x}" cy="${y}" r="3" fill="${color}"><title>${data[i].run_id}: ${data[i][key]}</title></circle>`;
  }

  return `<div class="trend-chart">
    <div class="trend-label">${label}</div>
    <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
      <line x1="${PAD}" y1="${PAD + plotH}" x2="${PAD + plotW}" y2="${PAD + plotH}" stroke="var(--border)" stroke-width="1"/>
      <polyline points="${points}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linejoin="round"/>
      ${dots}
      <text x="${PAD}" y="${H - 2}" font-size="8" fill="var(--text-3)">${data[0]?.run_id?.substring(4,14) || ''}</text>
      <text x="${PAD + plotW}" y="${H - 2}" font-size="8" fill="var(--text-3)" text-anchor="end">${data[n-1]?.run_id?.substring(4,14) || ''}</text>
      <text x="${PAD - 2}" y="${PAD + 4}" font-size="8" fill="var(--text-3)" text-anchor="end">${max}</text>
      <text x="${PAD - 2}" y="${PAD + plotH}" font-size="8" fill="var(--text-3)" text-anchor="end">0</text>
    </svg>
  </div>`;
}

function mkCard(value, label, colorClass) {
  return `<div class="card">
    <div class="card-value ${colorClass}">${value}</div>
    <div class="card-label">${label}</div>
  </div>`;
}

function statItem(value, label) {
  return `<div class="stat-item">
    <div class="stat-value">${value}</div>
    <div class="stat-label">${label}</div>
  </div>`;
}

// Tabs
function initTabs() {
  const tabs = document.querySelectorAll('.tab');
  const hash = window.location.hash.replace('#', '');
  if (hash) {
    tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === hash));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.dataset.tab === hash));
    if (hash === 'history') loadHistoryTab();
  }
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      tab.classList.add('active');
      document.querySelector(`.tab-content[data-tab="${tab.dataset.tab}"]`).classList.add('active');
      window.location.hash = tab.dataset.tab;
      // Lazy-load gap details
      if (tab.dataset.tab === 'gaps' && !gapDetailsLoaded) loadGapDetails();
      // Lazy-load history from Supabase
      if (tab.dataset.tab === 'history') loadHistoryTab();
    });
  });
}

// Sortable tables
function initSortable() {
  document.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const table = th.closest('table');
      const tbody = table.querySelector('tbody');
      const col = parseInt(th.dataset.col);
      const isNum = th.dataset.type === 'num';
      const isAsc = th.classList.contains('asc');

      // Reset other headers in same table
      table.querySelectorAll('th.sortable').forEach(h => { h.classList.remove('asc', 'desc'); });
      th.classList.add(isAsc ? 'desc' : 'asc');

      const rows = Array.from(tbody.querySelectorAll('tr:not(.gap-detail-row)'));
      rows.sort((a, b) => {
        let va = a.cells[col]?.textContent.trim().replace('%', '') || '';
        let vb = b.cells[col]?.textContent.trim().replace('%', '') || '';
        if (isNum) {
          va = parseFloat(va) || 0;
          vb = parseFloat(vb) || 0;
          return isAsc ? vb - va : va - vb;
        }
        return isAsc ? vb.localeCompare(va) : va.localeCompare(vb);
      });

      // Re-append rows (and their detail rows)
      for (const row of rows) {
        tbody.appendChild(row);
        const cells = row.querySelectorAll('td');
        const parent = (cells[1] || cells[0])?.textContent;
        const detailRow = tbody.querySelector(`tr.gap-detail-row[data-parent="${parseInt(parent) - 1}"]`);
        if (detailRow) tbody.appendChild(detailRow);
      }
    });
  });
}

// Gap filters
function initGapFilters() {
  const fType = document.getElementById('f-type');
  const fCat = document.getElementById('f-cat');
  const fSev = document.getElementById('f-sev');
  const fSearch = document.getElementById('f-search');
  const countEl = document.getElementById('gap-count');

  if (!fType) return;

  function applyFilters() {
    const type = fType.value;
    const cat = fCat.value;
    const sev = fSev.value;
    const search = fSearch.value.toLowerCase();
    let visible = 0;

    document.querySelectorAll('tr.gap-row').forEach(row => {
      const show = (!type || row.dataset.type === type)
        && (!cat || row.dataset.cat === cat)
        && (!sev || row.dataset.sev === sev)
        && (!search || row.dataset.query.includes(search));
      row.style.display = show ? '' : 'none';
      // Hide detail rows too
      const idx = row.querySelectorAll('td')[1]?.textContent;
      const detail = document.querySelector(`tr.gap-detail-row[data-parent="${parseInt(idx) - 1}"]`);
      if (detail) detail.style.display = 'none';
      // Uncheck hidden rows
      if (!show) {
        const cb = row.querySelector('.gap-check');
        if (cb) { cb.checked = false; row.classList.remove('gap-selected'); }
      }
      if (show) visible++;
    });
    countEl.textContent = `${visible} gaps shown`;
    updateBulkBar();
  }

  [fType, fCat, fSev].forEach(el => el.addEventListener('change', applyFilters));
  fSearch.addEventListener('input', applyFilters);
  applyFilters();
}

let allGapsRef = [];

function identifyWeakFactor(g) {
  const factors = { food: g.food, vibe: g.vibe, service: g.service, reputation: g.reputation, convenience: g.convenience };
  let weakest = 'food', min = Infinity;
  for (const [k, v] of Object.entries(factors)) {
    if (v < min) { min = v; weakest = k; }
  }
  return { name: weakest, score: min };
}

${factors}

function buildBulkFixPrompt(gaps) {
  const intent = gaps.filter(g => g.gap_type === 'intent');
  const scoring = gaps.filter(g => g.gap_type === 'scoring');
  const ceiling = gaps.filter(g => g.gap_type === 'relevance_ceiling');

  let prompt = `Fix ${gaps.length} gaps in the DondeAI scoring engine.\n`;

  if (intent.length) {
    prompt += `\n## Intent Gaps (${intent.length})\n\n| Query | DM | Category | Restaurant |\n|-------|-----|----------|------------|\n`;
    for (const g of intent) prompt += `| ${g.query} | ${g.dm} | ${g.category} | ${g.restaurant} |\n`;
    prompt += `\nFile: /home/user/dondeBackend/supabase/functions/recommend/_shared/intent-classifier-v5.ts\nAdd keywords from these queries to the appropriate dictionaries (FLAVOR_WORDS, VIBE_WORDS, CONSTRAINT_PATTERNS, EMOTIONAL_INTENT_PATTERNS, or CONTEXT_PATTERNS).\n`;
  }

  if (scoring.length) {
    prompt += `\n## Scoring Gaps (${scoring.length})\n\n| Query | DM | Category | Weakest Factor | Score |\n|-------|-----|----------|----------------|-------|\n`;
    for (const g of scoring) {
      const w = identifyWeakFactor(g);
      prompt += `| ${g.query} | ${g.dm} | ${g.category} | ${w.name} | ${w.score} |\n`;
    }
    prompt += `\nFile: /home/user/dondeBackend/supabase/functions/recommend/_shared/scoring-v9.ts (QUALITY_WEIGHTS, line ~483)\nReview weight profiles for these query patterns.\n`;
  }

  if (ceiling.length) {
    prompt += `\n## Relevance Ceiling Gaps (${ceiling.length})\n\n| Query | DM | Category | Restaurant |\n|-------|-----|----------|------------|\n`;
    for (const g of ceiling) prompt += `| ${g.query} | ${g.dm} | ${g.category} | ${g.restaurant} |\n`;
    prompt += `\nFile: /home/user/dondeBackend/supabase/functions/recommend/_shared/scoring-v9.ts (relevance multiplier)\nInvestigate relevance classification and semantic tag coverage.\n`;
  }

  prompt += `\n## Verification\nAfter all changes, run:\ncd /home/user/dondeBackend\nnpx supabase functions serve recommend --no-verify-jwt &\nsleep 3\n`;
  for (const g of gaps) {
    prompt += `curl -s -X POST http://localhost:54321/functions/v1/recommend -H "Content-Type: application/json" -d '{"special_request": "${g.query}"}' | jq '.donde_match'\n`;
  }

  return prompt;
}

function openFixSession(prompt, btn, label) {
  // Try clipboard, but don't gate everything on it
  let copied = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(prompt).then(() => { copied = true; }).catch(() => {});
    }
  } catch(e) {}

  // Fallback: copy via execCommand
  if (!copied) {
    try {
      const ta = document.createElement('textarea');
      ta.value = prompt;
      ta.style.cssText = 'position:fixed;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      copied = true;
    } catch(e) {}
  }

  // Always show feedback + link regardless of clipboard success
  if (btn) {
    const link = document.createElement('a');
    link.href = 'https://claude.ai/code';
    link.target = '_blank';
    link.rel = 'noopener';
    link.className = 'fix-session-link';
    link.textContent = 'Open Claude Code \u2192';
    link.addEventListener('click', (e) => e.stopPropagation());

    btn.classList.add('copied');
    btn.textContent = 'Prompt copied! ';
    btn.appendChild(link);

    setTimeout(() => {
      btn.classList.remove('copied');
      btn.textContent = label;
    }, 8000);
  }
}

window._loadComparison = async function() {
  const runA = document.getElementById('compare-a')?.value;
  const runB = document.getElementById('compare-b')?.value;
  const el = document.getElementById('comparison-results');
  if (!runA || !runB || !el) return;
  if (runA === runB) { el.innerHTML = '<p style="color:var(--text-3)">Select two different runs to compare.</p>'; return; }

  el.innerHTML = '<p style="color:var(--text-3)">Loading comparison...</p>';

  try {
    const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Fetch dataset_hash for both runs to determine comparison mode
    const { data: runMeta } = await sb
      .from('gauntlet_runs')
      .select('run_id, dataset_hash, dataset_size, total')
      .in('run_id', [runA, runB]);

    const metaA = runMeta?.find(r => r.run_id === runA);
    const metaB = runMeta?.find(r => r.run_id === runB);
    const sameDataset = metaA && metaB && metaA.dataset_hash === metaB.dataset_hash;

    let rows;
    let comparisonMode;

    if (sameDataset) {
      // Same dataset — use RPC join on query_id (exact match)
      comparisonMode = 'same_dataset';
      const { data, error } = await sb.rpc('get_run_comparison', { p_run_a: runA, p_run_b: runB });
      if (error) throw error;
      rows = data || [];
    } else {
      // Different datasets — fetch both result sets and match by normalized query text
      comparisonMode = 'cross_dataset';
      const [resA, resB] = await Promise.all([
        sb.from('gauntlet_results').select('query_id, query, category, donde_match, gap_type, restaurant_name').eq('run_id', runA),
        sb.from('gauntlet_results').select('query_id, query, category, donde_match, gap_type, restaurant_name').eq('run_id', runB),
      ]);
      const dataA = resA.data || [];
      const dataB = resB.data || [];

      // Normalize query text for fuzzy matching
      const normalize = (q) => (q || '').toLowerCase().trim().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ');

      // Build map from normalized query -> result for run B
      const mapB = new Map();
      for (const r of dataB) mapB.set(normalize(r.query), r);

      // Build map from normalized query -> result for run A
      const mapA = new Map();
      for (const r of dataA) mapA.set(normalize(r.query), r);

      rows = [];
      const seen = new Set();

      // Match A -> B
      for (const a of dataA) {
        const key = normalize(a.query);
        const b = mapB.get(key);
        seen.add(key);
        rows.push({
          query_id: a.query_id,
          query: a.query,
          category: a.category,
          dm_a: a.donde_match,
          dm_b: b ? b.donde_match : null,
          delta: b ? b.donde_match - a.donde_match : null,
          gap_a: a.gap_type,
          gap_b: b ? b.gap_type : null,
          restaurant_a: a.restaurant_name,
          restaurant_b: b ? b.restaurant_name : null,
          match_type: b ? 'matched' : 'only_a',
        });
      }

      // B-only queries (not in A)
      for (const b of dataB) {
        const key = normalize(b.query);
        if (seen.has(key)) continue;
        rows.push({
          query_id: b.query_id,
          query: b.query,
          category: b.category,
          dm_a: null,
          dm_b: b.donde_match,
          delta: null,
          gap_a: null,
          gap_b: b.gap_type,
          restaurant_a: null,
          restaurant_b: b.restaurant_name,
          match_type: 'only_b',
        });
      }
    }

    if (!rows || rows.length === 0) { el.innerHTML = '<p style="color:var(--text-3)">No results found for these runs.</p>'; return; }

    // Separate matched vs unmatched
    const matched = rows.filter(r => r.dm_a != null && r.dm_b != null);
    const onlyA = rows.filter(r => r.dm_b == null);
    const onlyB = rows.filter(r => r.dm_a == null);

    const improved = matched.filter(r => r.delta > 0).length;
    const regressed = matched.filter(r => r.delta < 0).length;
    const unchanged = matched.filter(r => r.delta === 0).length;
    const avgDelta = matched.length > 0 ? (matched.reduce((s, r) => s + (r.delta || 0), 0) / matched.length).toFixed(1) : '0';

    let h = '';

    // Dataset context banner
    if (!sameDataset) {
      h += `<div class="section-note" style="margin:8px 0;padding:8px 12px;background:var(--surface);border-left:3px solid var(--rag-amber);border-radius:4px">`;
      h += `<strong>Cross-dataset comparison</strong> — These runs used different test data (${metaA?.total || '?'} vs ${metaB?.total || '?'} queries). `;
      h += `Matched ${matched.length} queries by text. ${onlyA.length} only in Run A, ${onlyB.length} only in Run B.`;
      h += `</div>`;
    } else {
      h += `<div class="section-note" style="margin:8px 0;padding:8px 12px;background:var(--surface);border-left:3px solid var(--rag-green);border-radius:4px">`;
      h += `<strong>Same dataset comparison</strong> — Both runs used identical test queries (${metaA?.total || '?'} queries). Direct apples-to-apples comparison.`;
      h += `</div>`;
    }

    // Summary cards — only for matched queries
    h += `<div class="card-row" style="margin:12px 0">`;
    h += `<div class="card"><div class="card-value">${matched.length}</div><div class="card-label">Matched</div></div>`;
    h += `<div class="card"><div class="card-value rag-green">${improved}</div><div class="card-label">Improved</div></div>`;
    h += `<div class="card"><div class="card-value rag-red">${regressed}</div><div class="card-label">Regressed</div></div>`;
    h += `<div class="card"><div class="card-value">${unchanged}</div><div class="card-label">Unchanged</div></div>`;
    h += `<div class="card"><div class="card-value ${Number(avgDelta) > 0 ? 'rag-green' : Number(avgDelta) < 0 ? 'rag-red' : ''}">${Number(avgDelta) > 0 ? '+' : ''}${avgDelta}</div><div class="card-label">Avg Δ</div></div>`;
    if (!sameDataset) {
      h += `<div class="card"><div class="card-value" style="font-size:0.8rem">${onlyA.length} / ${onlyB.length}</div><div class="card-label">Only A / B</div></div>`;
    }
    h += '</div>';

    // Render comparison table
    const renderTable = (tableRows, title, showDelta) => {
      if (tableRows.length === 0) return '';
      let t = `<div style="margin-top:16px"><h4 style="font-size:0.75rem;color:var(--text-2);margin-bottom:6px">${title} (${tableRows.length})</h4>`;
      t += '<div class="table-wrap"><table><thead><tr>';
      t += '<th>Query</th><th>Cat</th><th>DM (A)</th><th>DM (B)</th>';
      if (showDelta) t += '<th>Δ</th>';
      t += '<th>Gap (A)</th><th>Gap (B)</th><th>Status</th>';
      t += '</tr></thead><tbody>';

      const sorted = [...tableRows].sort((a, b) => (a.delta || 0) - (b.delta || 0));
      for (const r of sorted) {
        const d = r.delta || 0;
        let status, statusClass;
        if (r.dm_a == null) { status = 'New in B'; statusClass = ''; }
        else if (r.dm_b == null) { status = 'Not in B'; statusClass = ''; }
        else if (r.gap_a && !r.gap_b) { status = 'Fixed'; statusClass = 'rag-green'; }
        else if (!r.gap_a && r.gap_b) { status = 'New Gap'; statusClass = 'rag-red'; }
        else if (d > 3) { status = 'Improved'; statusClass = 'rag-green'; }
        else if (d < -3) { status = 'Regressed'; statusClass = 'rag-red'; }
        else { status = 'Stable'; statusClass = ''; }

        t += '<tr>';
        t += `<td title="${r.query || ''}">${(r.query || '').substring(0, 35)}</td>`;
        t += `<td>${r.category || '—'}</td>`;
        t += `<td class="dm-cell ${r.dm_a != null ? (r.dm_a >= 80 ? 'rag-green' : r.dm_a >= 60 ? 'rag-amber' : 'rag-red') : ''}">${r.dm_a ?? '—'}</td>`;
        t += `<td class="dm-cell ${r.dm_b != null ? (r.dm_b >= 80 ? 'rag-green' : r.dm_b >= 60 ? 'rag-amber' : 'rag-red') : ''}">${r.dm_b ?? '—'}</td>`;
        if (showDelta) t += `<td style="color:${d > 0 ? 'var(--rag-green)' : d < 0 ? 'var(--rag-red)' : 'var(--text-3)'};font-weight:500;font-family:var(--font-mono)">${d > 0 ? '+' : ''}${d}</td>`;
        t += `<td>${r.gap_a || '—'}</td>`;
        t += `<td>${r.gap_b || '—'}</td>`;
        t += `<td><span class="badge ${statusClass ? 'badge-' + statusClass.replace('rag-', '') : ''}" style="${statusClass ? 'color:var(--' + statusClass + ')' : ''}">${status}</span></td>`;
        t += '</tr>';
      }
      t += '</tbody></table></div></div>';
      return t;
    };

    h += renderTable(matched, 'Matched Queries', true);
    if (onlyA.length > 0) h += renderTable(onlyA, 'Only in Run A', false);
    if (onlyB.length > 0) h += renderTable(onlyB, 'Only in Run B', false);

    el.innerHTML = h;
  } catch (e) {
    el.innerHTML = `<p style="color:var(--rag-red)">Comparison failed: ${e.message}</p>`;
  }
};

      if (cb) {
        cb.checked = checked;
        row.classList.toggle('gap-selected', checked);
      }
    });
    updateBulkBar();
  });

  // Attach change listener directly to each checkbox (delegation can miss events)
  document.querySelectorAll('.gap-check[data-idx]').forEach(cb => {
    cb.addEventListener('change', () => {
      cb.closest('tr')?.classList.toggle('gap-selected', cb.checked);
      updateBulkBar();
    });
  });
}

/* ── Init ─────────────────────────────────────────────────────────────────── */
document.getElementById('refresh-btn').addEventListener('click', () => loadData());
checkAuth();
</script>

</body>
