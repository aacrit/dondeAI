<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission Control — DondeAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/command-center.css">
</head>
<body>

  <!-- Auth Gate -->
  <div class="mc-auth-gate" id="auth-gate">
    <div class="mc-auth-card">
      <div class="mc-auth-logo">
        <svg viewBox="0 0 32 44" width="32" height="44">
          <path d="M10.5 1 C10.5 1, 10 8.5, 12.5 11.5 Q14 13, 14.5 13.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M21.5 1 C21.5 1, 22 8.5, 19.5 11.5 Q18 13, 17.5 13.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M16 13.5 C22 11, 29 14, 28 21 C27 27, 19 29, 16 31 L16 34" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
          <circle cx="16" cy="40" r="2.8" fill="var(--cc-accent)"/>
        </svg>
      </div>
      <h2>DondeAI Mission Control</h2>
      <p id="auth-message">Sign in with your Google account to continue.</p>
      <button class="mc-auth-btn" id="auth-sign-in">Sign in with Google</button>
    </div>
  </div>

  <!-- Header -->
  <header class="mc-header" role="banner">
    <div class="mc-header__left">
      <div class="mc-header__logo">
        <svg viewBox="0 0 32 44" width="16" height="22">
          <path d="M10.5 1 C10.5 1, 10 8.5, 12.5 11.5 Q14 13, 14.5 13.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M21.5 1 C21.5 1, 22 8.5, 19.5 11.5 Q18 13, 17.5 13.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M16 13.5 C22 11, 29 14, 28 21 C27 27, 19 29, 16 31 L16 34" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
          <circle cx="16" cy="40" r="2.8" fill="var(--cc-accent)"/>
        </svg>
        <span>Mission Control</span>
      </div>
    </div>
    <div class="mc-header__right">
      <div class="mc-mode-toggle mc-mode-toggle--test" id="mode-toggle">
        <span class="mc-mode-toggle__slider"></span>
        <button class="mc-mode-toggle__option mc-mode-toggle__option--active" data-mode-btn="test" onclick="switchDashboardMode('test')">TEST</button>
        <button class="mc-mode-toggle__option" data-mode-btn="live" onclick="switchDashboardMode('live')">LIVE</button>
      </div>
      <button class="mc-header__terminal-btn" onclick="toggleDrawer()" title="Toggle Agent Team" aria-label="Toggle agent panel">
        <span style="font-family:var(--font-mono);font-size:var(--text-xs)">$_</span>
      </button>
      <span class="mc-health-dot" id="mc-health-dot" title="System health" role="status" aria-label="System health indicator"></span>
      <a href="index.html" class="mc-header__back" title="Back to DondeAI">Back</a>
    </div>
  </header>

  <!-- Main Dashboard (full-width scrollable) -->
  <main class="mc-dashboard" id="main-content" style="display:none">

    <!-- Morning Brief Banner -->
    <div class="mc-brief" id="mc-brief" data-mode="test" style="display:none">
      <div class="mc-brief__icon" id="mc-brief-icon"></div>
      <div class="mc-brief__text" id="mc-brief-text"></div>
      <div class="mc-smart-action" id="mc-smart-action"></div>
    </div>

    <!-- Hero: 5 Pulse Cards — unified grid, all expand on click -->
    <div class="mc-pulse mc-pulse--5" data-mode="test">
      <div class="mc-pulse-col">
        <button class="mc-pulse-card" id="pulse-health" role="status" onclick="togglePulseExpand('health')" title="Expand health details">
          <div class="mc-pulse-card__value rag-green" id="pulse-health-val">--</div>
          <div class="mc-pulse-card__label">Pass Rate</div>
        </button>
        <div class="mc-pulse-expand" id="pulse-expand-health"></div>
      </div>
      <div class="mc-pulse-col">
        <button class="mc-pulse-card" id="pulse-dm" role="status" onclick="togglePulseExpand('dm')" title="Expand score details">
          <div class="mc-pulse-card__value" id="pulse-dm-val">--</div>
          <div class="mc-pulse-card__label">Avg DM</div>
        </button>
        <div class="mc-pulse-expand" id="pulse-expand-dm"></div>
      </div>
      <div class="mc-pulse-col">
        <button class="mc-pulse-card" id="pulse-issues" role="status" onclick="togglePulseExpand('issues')" title="Expand issue details">
          <div class="mc-pulse-card__value" id="pulse-issues-val">--</div>
          <div class="mc-pulse-card__label">Issues</div>
        </button>
        <div class="mc-pulse-expand" id="pulse-expand-issues"></div>
      </div>
      <div class="mc-pulse-col">
        <button class="mc-pulse-card mc-pulse-card--grade" id="mc-grade" role="status" onclick="togglePulseExpand('grade')" title="Expand engine grade">
          <div class="mc-pulse-card__value" id="mc-grade-letter">--</div>
          <div class="mc-pulse-card__label" id="mc-grade-sub">Engine Grade</div>
          <div class="mc-grade__dist" id="mc-grade-dist"></div>
        </button>
        <div class="mc-pulse-expand" id="pulse-expand-grade"></div>
      </div>
      <div class="mc-pulse-col">
        <button class="mc-pulse-card" id="pulse-infra" role="status" onclick="togglePulseExpand('infra')" title="Expand DB and cache health">
          <div class="mc-pulse-card__value" id="pulse-infra-val">--</div>
          <div class="mc-pulse-card__label">DB &amp; Cache</div>
        </button>
        <div class="mc-pulse-expand" id="pulse-expand-infra"></div>
      </div>
    </div>

    <!-- Agent Team — shared between TEST and LIVE -->
    <div class="mc-section mc-section--agents">
      <div class="mc-section__title">Agent Team</div>
      <div class="mc-agents-grid" id="mc-agents"></div>
    </div>

    <!-- Actions -->
    <div class="mc-section" data-mode="test">
      <div class="mc-section__title">Actions</div>
      <div class="mc-actions" role="toolbar" aria-label="Quick actions">
        <button class="mc-action-btn" id="action-scan" onclick="processCOOInput('scan')">
          <span class="mc-action-btn__icon">&#9654;</span>
          <span class="mc-action-btn__label">Run Scan</span>
          <span class="mc-action-btn__meta">20 queries &middot; $0</span>
        </button>
        <button class="mc-action-btn" id="action-regression" onclick="processCOOInput('regression')">
          <span class="mc-action-btn__icon">&#9878;</span>
          <span class="mc-action-btn__label">Regression</span>
          <span class="mc-action-btn__meta">23 golden &middot; $0</span>
        </button>
        <button class="mc-action-btn" id="action-fix" onclick="processCOOInput('fix bugs')">
          <span class="mc-action-btn__icon">&#128295;</span>
          <span class="mc-action-btn__label">Fix Bugs</span>
          <span class="mc-action-btn__meta">CLI command</span>
        </button>
        <button class="mc-action-btn" id="action-db" onclick="processCOOInput('db health')">
          <span class="mc-action-btn__icon">&#128202;</span>
          <span class="mc-action-btn__label">DB Health</span>
          <span class="mc-action-btn__meta">Coverage check</span>
        </button>
        <button class="mc-action-btn" id="action-security" onclick="processCOOInput('security audit')">
          <span class="mc-action-btn__icon">&#128274;</span>
          <span class="mc-action-btn__label">Security</span>
          <span class="mc-action-btn__meta">CLI command</span>
        </button>
        <button class="mc-action-btn" id="action-cache" onclick="processCOOInput('cache status')">
          <span class="mc-action-btn__icon">&#9889;</span>
          <span class="mc-action-btn__label">Cache</span>
          <span class="mc-action-btn__meta">Hit rate &middot; savings</span>
        </button>
      </div>
    </div>

    <!-- Quick Test -->
    <div class="mc-section" data-mode="test">
      <div class="mc-section__title">Quick Test</div>
      <div class="mc-quick-test">
        <input type="text" class="mc-quick-test__input" id="quick-test-input" placeholder="Enter a query to test... e.g. romantic Italian dinner" autocomplete="off" spellcheck="false">
        <button class="mc-quick-test__btn" id="quick-test-btn" onclick="runQuickTest()">Test</button>
      </div>
      <div class="mc-quick-test__result" id="quick-test-result"></div>
      <div id="quick-test-card"></div>
    </div>

    <!-- Recent Runs + Live Feed side by side -->
    <div class="mc-columns" data-mode="test">
      <div class="mc-section mc-section--test">
        <div class="mc-section__title"><span class="mc-section__dot mc-section__dot--test"></span> Test Runs</div>
        <div class="mc-runs" id="mc-runs">
          <div class="mc-empty">No runs yet</div>
        </div>
      </div>
      <div class="mc-section mc-section--live">
        <div class="mc-section__title"><span class="mc-section__dot mc-section__dot--live"></span> Live Feed</div>
        <div class="mc-feed" id="mc-feed">
          <div class="mc-empty">No recent queries</div>
        </div>
      </div>
    </div>

    <!-- LIVE MODE: Morning Brief -->
    <div class="mc-brief mc-brief--live" id="mc-brief-live" data-mode="live" style="display:none">
      <div class="mc-brief__icon" id="mc-brief-live-icon"></div>
      <div class="mc-brief__text" id="mc-brief-live-text"></div>
      <div class="mc-smart-action" id="mc-smart-action-live"></div>
    </div>

    <!-- LIVE MODE: 6 Pulse Cards (Response Quality > Operational > Satisfaction) -->
    <div class="mc-pulse mc-pulse--6" data-mode="live" style="display:none">
      <div class="mc-pulse-col">
        <button class="mc-pulse-card mc-pulse-card--live" id="pulse-live-blurb" role="status" onclick="togglePulseExpand('live-blurb')" title="Live blurb quality">
          <div class="mc-pulse-card__value" id="pulse-live-blurb-val">--</div>
          <div class="mc-pulse-card__label">Blurb Quality</div>
        </button>
        <div class="mc-pulse-expand" id="pulse-expand-live-blurb"></div>
      </div>
      <div class="mc-pulse-col">
        <button class="mc-pulse-card mc-pulse-card--live" id="pulse-live-fit" role="status" onclick="togglePulseExpand('live-fit')" title="Live score fit">
          <div class="mc-pulse-card__value" id="pulse-live-fit-val">--</div>
          <div class="mc-pulse-card__label">Score Fit</div>
        </button>
        <div class="mc-pulse-expand" id="pulse-expand-live-fit"></div>
      </div>
      <div class="mc-pulse-col">
        <button class="mc-pulse-card mc-pulse-card--live" id="pulse-live-rt" role="status" onclick="togglePulseExpand('live-rt')" title="Response time">
          <div class="mc-pulse-card__value" id="pulse-live-rt-val">--</div>
          <div class="mc-pulse-card__label">Response Time</div>
        </button>
        <div class="mc-pulse-expand" id="pulse-expand-live-rt"></div>
      </div>
      <div class="mc-pulse-col">
        <button class="mc-pulse-card mc-pulse-card--live" id="pulse-live-cache" role="status" onclick="togglePulseExpand('live-cache')" title="Cache hit rate">
          <div class="mc-pulse-card__value" id="pulse-live-cache-val">--</div>
          <div class="mc-pulse-card__label">Cache Hits</div>
        </button>
        <div class="mc-pulse-expand" id="pulse-expand-live-cache"></div>
      </div>
      <div class="mc-pulse-col">
        <button class="mc-pulse-card mc-pulse-card--live" id="pulse-live-dm" role="status" onclick="togglePulseExpand('live-dm')" title="Live avg DM">
          <div class="mc-pulse-card__value" id="pulse-live-dm-val">--</div>
          <div class="mc-pulse-card__label">Avg DM</div>
        </button>
        <div class="mc-pulse-expand" id="pulse-expand-live-dm"></div>
      </div>
      <div class="mc-pulse-col">
        <button class="mc-pulse-card mc-pulse-card--live" id="pulse-live-pass" role="status" onclick="togglePulseExpand('live-pass')" title="Live pass rate">
          <div class="mc-pulse-card__value" id="pulse-live-pass-val">--</div>
          <div class="mc-pulse-card__label">Pass Rate</div>
        </button>
        <div class="mc-pulse-expand" id="pulse-expand-live-pass"></div>
      </div>
    </div>

    <!-- LIVE MODE: Actions -->
    <div class="mc-section" data-mode="live" style="display:none">
      <div class="mc-section__title">Live Actions</div>
      <div class="mc-actions" role="toolbar">
        <button class="mc-action-btn" onclick="viewSlowQueries()">
          <span class="mc-action-btn__icon">&#9201;</span>
          <span class="mc-action-btn__label">Slow Queries</span>
          <span class="mc-action-btn__meta">p95 &gt; 5s</span>
        </button>
        <button class="mc-action-btn" onclick="viewLowScoreQueries()">
          <span class="mc-action-btn__icon">&#128201;</span>
          <span class="mc-action-btn__label">Low Scores</span>
          <span class="mc-action-btn__meta">DM &lt; 60</span>
        </button>
        <button class="mc-action-btn" onclick="viewFallbacks()">
          <span class="mc-action-btn__icon">&#9888;</span>
          <span class="mc-action-btn__label">Fallbacks</span>
          <span class="mc-action-btn__meta">Error responses</span>
        </button>
        <button class="mc-action-btn" onclick="processCOOInput('warm cache')">
          <span class="mc-action-btn__icon">&#9889;</span>
          <span class="mc-action-btn__label">Warm Cache</span>
          <span class="mc-action-btn__meta">Pre-populate</span>
        </button>
        <button class="mc-action-btn" onclick="processCOOInput('cache status')">
          <span class="mc-action-btn__icon">&#128202;</span>
          <span class="mc-action-btn__label">Cache Status</span>
          <span class="mc-action-btn__meta">Hit rate details</span>
        </button>
        <button class="mc-action-btn" onclick="processCOOInput('live')">
          <span class="mc-action-btn__icon">&#128640;</span>
          <span class="mc-action-btn__label">Recent Queries</span>
          <span class="mc-action-btn__meta">Last 10 in terminal</span>
        </button>
      </div>
    </div>

    <!-- LIVE MODE: Full Feed -->
    <div class="mc-section mc-section--live" data-mode="live" style="display:none">
      <div class="mc-section__title" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--space-sm)">
        <span><span class="mc-section__dot mc-section__dot--live"></span> Live Production Queries <span id="mc-live-query-count" style="font-family:var(--font-mono);color:var(--cc-live)"></span></span>
        <div class="mc-time-toggle" id="mc-time-toggle">
          <button class="mc-time-toggle__btn mc-time-toggle__btn--active" data-period="24h" onclick="setLivePeriod('24h')">24h</button>
          <button class="mc-time-toggle__btn" data-period="7d" onclick="setLivePeriod('7d')">7D</button>
          <button class="mc-time-toggle__btn" data-period="30d" onclick="setLivePeriod('30d')">30D</button>
          <button class="mc-time-toggle__btn" data-period="ytd" onclick="setLivePeriod('ytd')">YTD</button>
        </div>
      </div>
      <div class="mc-feed mc-feed--full" id="mc-live-feed-full">
        <div class="mc-empty">Loading live data...</div>
      </div>
    </div>

  </main>

  <!-- Test Confirmation Modal -->
  <div class="mc-confirm-backdrop" id="mc-confirm-backdrop" onclick="cancelTestConfirm()" style="display:none"></div>
  <div class="mc-confirm" id="mc-confirm" role="dialog" aria-modal="true" aria-label="Confirm test" style="display:none">
    <div class="mc-confirm__header">
      <span class="mc-confirm__icon" id="mc-confirm-icon">&#9654;</span>
      <span class="mc-confirm__title" id="mc-confirm-title">Confirm Test</span>
    </div>
    <div class="mc-confirm__body" id="mc-confirm-body"></div>
    <div class="mc-confirm__customize" id="mc-confirm-customize" style="display:none"></div>
    <div class="mc-confirm__actions">
      <button class="mc-confirm__tweak" id="mc-confirm-tweak" onclick="toggleTestCustomize()">Customize</button>
      <span style="flex:1"></span>
      <button class="mc-confirm__cancel" onclick="cancelTestConfirm()">Cancel</button>
      <button class="mc-confirm__run" id="mc-confirm-run" onclick="executeConfirmedTest()">Run Test</button>
    </div>
  </div>

  <!-- Detail Panel (slides in from right) -->
  <aside class="mc-detail" id="mc-detail" aria-label="Query detail">
    <div class="mc-detail__header">
      <span class="mc-detail__title" id="mc-detail-title">Detail</span>
      <button class="mc-detail__close" onclick="closeDetail()" aria-label="Close detail panel">&times;</button>
    </div>
    <div class="mc-detail__body" id="mc-detail-body"></div>
  </aside>

  <!-- Agent Team Drawer (left panel) -->
  <div class="mc-drawer" id="mc-drawer" role="region" aria-label="Agent Team">
    <button class="mc-drawer__toggle" id="mc-drawer-toggle" onclick="toggleDrawer()" aria-expanded="false">
      <span class="mc-drawer__chevron" id="mc-drawer-chevron">&#9650;</span>
      <span class="mc-drawer__label">Agent Team</span>
      <span class="mc-drawer__badge" id="mc-drawer-badge" style="display:none">0</span>
      <span class="mc-drawer__spacer"></span>
      <span class="mc-drawer__agent-count" id="mc-drawer-agent-count">26 agents</span>
    </button>
    <div class="mc-drawer__body" id="mc-drawer-body">
      <!-- Agent Hierarchy (primary content) -->
      <div class="mc-drawer__agents" id="mc-drawer-agents"></div>

      <!-- Terminal (collapsed at bottom) -->
      <div class="mc-drawer__terminal-section">
        <button class="mc-drawer__terminal-toggle" id="mc-terminal-toggle" onclick="toggleTerminalInDrawer()">
          <span class="mc-drawer__terminal-chevron" id="mc-terminal-chevron">&#9660;</span>
          <span>Terminal</span>
          <span class="mc-drawer__badge" id="mc-terminal-badge" style="display:none">0</span>
        </button>
        <div class="mc-drawer__terminal-body" id="mc-terminal-body" style="display:none">
          <div class="mc-terminal__output" id="coo-output" role="log" aria-live="polite" aria-label="Terminal output"></div>
          <div class="mc-terminal__input-row">
            <span class="mc-terminal__prompt">$</span>
            <input type="text" class="mc-terminal__input" id="coo-input" placeholder="Type a command..." autocomplete="off" spellcheck="false">
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="mc-footer" id="mc-footer" role="contentinfo">
    <span id="mc-footer-engine">Engine V18</span>
    <span class="mc-footer__sep">|</span>
    <span id="mc-footer-cache">Cache --</span>
    <span class="mc-footer__sep">|</span>
    <span id="mc-footer-latency">-- avg</span>
    <span class="mc-footer__sep">|</span>
    <span>26 agents</span>
  </footer>

  <div class="mc-dark-pulse" id="dark-pulse"></div>

  <script src="js/cc-queries.js"></script>
  <script src="js/cc-config.js"></script>
  <script src="js/cc-grading.js"></script>
  <script src="js/cc-coo.js"></script>
  <script src="js/cc-tests.js"></script>
  <script src="js/cc-analytics.js"></script>
  <script src="js/cc-ui.js"></script>

</body>
</html>
