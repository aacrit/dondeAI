<!DOCTYPE html>
<html lang="en" data-theme="neutral" data-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1715">
  <title>DondeAI — Find Your Spot</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/themes/neutral.css">
  <link rel="stylesheet" href="css/themes/indian.css">
  <link rel="stylesheet" href="css/themes/japanese.css">
  <link rel="stylesheet" href="css/themes/southamerican.css">
  <link rel="stylesheet" href="css/themes/middleeastern.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <a class="skip-link" href="#craving-input">Skip to search</a>

  <main class="surface" id="surface" data-phase="idle">

    <!-- ===== HEADER (morphs between expanded/collapsed) ===== -->
    <header class="header" id="header">
      <div class="header__bar">
        <div class="header__logo" aria-label="DondeAI">
          <svg class="header__logo-mark" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
            <circle cx="14" cy="14" r="12" fill="none" stroke="var(--fg3)" stroke-width="1.5"/>
            <circle cx="14" cy="14" r="3" fill="var(--ac)"/>
          </svg>
          <span class="header__logo-text">DondeAI</span>
        </div>
        <button class="header__theme-btn" id="theme-toggle" aria-label="Change theme" type="button">
          <svg width="20" height="20" viewBox="0 0 256 256" aria-hidden="true">
            <path fill="currentColor" d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,0,1,0-176Z"/>
          </svg>
        </button>
      </div>

      <h1 class="header__prompt" id="prompt-text">What are you craving?</h1>

      <div class="header__input-wrap" id="input-wrap">
        <input
          class="header__input"
          id="craving-input"
          type="text"
          placeholder="Type anything..."
          autocomplete="off"
          autocorrect="on"
          spellcheck="false"
          enterkeyhint="search"
          aria-label="What are you craving?"
        >
        <button class="header__voice-btn" id="voice-btn" type="button" aria-label="Voice input">
          <svg width="18" height="18" viewBox="0 0 256 256" aria-hidden="true">
            <path fill="currentColor" d="M128,176a48.05,48.05,0,0,0,48-48V64a48,48,0,0,0-96,0v64A48.05,48.05,0,0,0,128,176ZM96,64a32,32,0,0,1,64,0v64a32,32,0,0,1-64,0Zm40,143.6V232a8,8,0,0,1-16,0V207.6A80.11,80.11,0,0,1,48,128a8,8,0,0,1,16,0,64,64,0,0,0,128,0,8,8,0,0,1,16,0A80.11,80.11,0,0,1,136,207.6Z"/>
          </svg>
        </button>
        <button class="header__submit-btn" id="submit-btn" type="button" aria-label="Search" hidden>
          <svg width="18" height="18" viewBox="0 0 256 256" aria-hidden="true">
            <path fill="currentColor" d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69l-58.35-58.34a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z"/>
          </svg>
        </button>
        <button class="header__close-btn" id="close-btn" type="button" aria-label="Start over">
          <svg width="18" height="18" viewBox="0 0 256 256" aria-hidden="true">
            <path fill="currentColor" d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/>
          </svg>
        </button>
      </div>

      <div class="header__collapsed-query" id="collapsed-query">
        <span class="header__query-text" id="query-text"></span>
        <div class="header__active-filters" id="active-filters"></div>
      </div>

      <!-- Filter strip -->
      <div class="filters" id="filters" hidden>
        <div class="filters__group" role="radiogroup" aria-label="Occasion">
          <button class="filters__chip" data-filter="occasion" data-value="Date" role="radio" aria-checked="false">Date</button>
          <button class="filters__chip" data-filter="occasion" data-value="Group" role="radio" aria-checked="false">Group</button>
          <button class="filters__chip" data-filter="occasion" data-value="Family" role="radio" aria-checked="false">Family</button>
          <button class="filters__chip" data-filter="occasion" data-value="Solo" role="radio" aria-checked="false">Solo</button>
          <button class="filters__chip" data-filter="occasion" data-value="Business" role="radio" aria-checked="false">Business</button>
        </div>
        <div class="filters__group" role="radiogroup" aria-label="Price">
          <button class="filters__chip filters__chip--price" data-filter="priceLevel" data-value="$" role="radio" aria-checked="false">$</button>
          <button class="filters__chip filters__chip--price" data-filter="priceLevel" data-value="$$" role="radio" aria-checked="false">$$</button>
          <button class="filters__chip filters__chip--price" data-filter="priceLevel" data-value="$$$" role="radio" aria-checked="false">$$$</button>
          <button class="filters__chip filters__chip--price" data-filter="priceLevel" data-value="$$$$" role="radio" aria-checked="false">$$$$</button>
        </div>
        <div class="filters__group filters__group--inline">
          <button class="filters__chip" id="filter-hood" data-action="open-hood-sheet" type="button">Neighborhood</button>
          <button class="filters__chip" id="filter-open" data-filter="openNow" aria-pressed="false" type="button">Open Now</button>
          <button class="filters__chip" id="filter-dietary" data-action="open-dietary-sheet" type="button">Dietary</button>
        </div>
      </div>

      <button class="header__filters-toggle" id="filters-toggle" type="button">
        <span id="filters-toggle-text">Filters</span>
        <svg class="header__filters-arrow" width="12" height="12" viewBox="0 0 256 256" aria-hidden="true">
          <path fill="currentColor" d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/>
        </svg>
      </button>
    </header>

    <!-- ===== LOADING ===== -->
    <div class="loading" id="loading">
      <div class="loading__ripple" id="ink-ripple"></div>
      <p class="loading__text" id="loading-text">Finding your spot...</p>
    </div>

    <!-- ===== ERROR ===== -->
    <div class="error" id="error">
      <p class="error__text" id="error-text"></p>
      <button class="error__retry" id="retry-btn" type="button">Try again</button>
    </div>

    <!-- ===== RECENT HISTORY ===== -->
    <section class="history" id="history" aria-label="Recent searches">
      <h2 class="history__title">Recent</h2>
      <ul class="history__list" id="history-list"></ul>
    </section>

    <!-- ===== RESULT CARD ===== -->
    <article class="result" id="result" aria-label="Recommendation">
      <div class="result__tier1">
        <div class="result__photos" id="photos" hidden>
          <div class="result__photos-track" id="photos-track"></div>
        </div>

        <div class="result__identity">
          <div class="result__score" id="score-ring" aria-label="Match score">
            <svg class="result__score-svg" viewBox="0 0 48 48">
              <circle cx="24" cy="24" r="21" fill="none" stroke="var(--bg3)" stroke-width="3"/>
              <circle class="result__score-fill" cx="24" cy="24" r="21" fill="none" stroke-width="3"
                stroke-dasharray="132" stroke-dashoffset="132" stroke-linecap="round"
                transform="rotate(-90 24 24)"/>
            </svg>
            <span class="result__score-num" id="score-num">0</span>
          </div>
          <div class="result__name-block">
            <h2 class="result__name" id="result-name"></h2>
            <p class="result__meta" id="result-meta"></p>
            <p class="result__status" id="result-status"></p>
          </div>
        </div>

        <div class="result__blurb" id="result-blurb"></div>

        <div class="result__tip" id="result-tip" hidden>
          <span class="result__tip-icon" aria-hidden="true"></span>
          <p class="result__tip-text" id="tip-text"></p>
        </div>

        <div class="result__actions">
          <a class="result__cta result__cta--primary" id="cta-navigate" href="#" target="_blank" rel="noopener">
            <svg width="16" height="16" viewBox="0 0 256 256" aria-hidden="true"><path fill="currentColor" d="M128,16a88.1,88.1,0,0,0-88,88c0,75.3,80,132.17,83.41,134.55a8,8,0,0,0,9.18,0C136,236.17,216,179.3,216,104A88.1,88.1,0,0,0,128,16Zm0,56a32,32,0,1,1-32,32A32,32,0,0,1,128,72Z"/></svg>
            Take me there
          </a>
          <button class="result__cta result__cta--secondary" id="cta-try-another" type="button">
            <svg width="16" height="16" viewBox="0 0 256 256" aria-hidden="true"><path fill="currentColor" d="M197.67,186.37a8,8,0,0,1,0,11.29C196.58,198.73,170.82,224,128,224c-37.39,0-64-24.36-80-48V200a8,8,0,0,1-16,0V160a8,8,0,0,1,8-8H80a8,8,0,0,1,0,16H54.29C67.84,190.3,90.78,208,128,208c36.27,0,58.13-21.44,58.36-21.68A8,8,0,0,1,197.67,186.37ZM216,40a8,8,0,0,0-8,8V72c-16-23.64-42.61-48-80-48-42.82,0-68.58,25.27-69.66,26.34a8,8,0,0,0,11.3,11.34C69.87,61.44,91.73,40,128,40c37.22,0,60.16,17.7,73.71,40H176a8,8,0,0,0,0,16h40a8,8,0,0,0,8-8V48A8,8,0,0,0,216,40Z"/></svg>
            Try another
          </button>
        </div>

        <div class="result__feedback">
          <button class="result__feedback-btn" id="feedback-down" type="button" aria-label="Not for me" aria-pressed="false">
            <svg width="18" height="18" viewBox="0 0 256 256" aria-hidden="true"><path fill="currentColor" d="M239.82,157l-12-96A24,24,0,0,0,204,40H32A16,16,0,0,0,16,56v88a16,16,0,0,0,16,16H75.06l37.78,75.58A8,8,0,0,0,120,240a40,40,0,0,0,40-40V184h56a24,24,0,0,0,23.82-27ZM32,144V56H72v88Zm191.94,15.5a8,8,0,0,1-7.94,8.5H152a8,8,0,0,0-8,8v24a24,24,0,0,1-19.29,23.54L88,150.11V56H204a8,8,0,0,1,7.94,7l12,96A8.08,8.08,0,0,1,223.94,159.5Z"/></svg>
          </button>
          <span class="result__queue-pos" id="queue-pos"></span>
          <button class="result__feedback-btn" id="feedback-up" type="button" aria-label="Love it" aria-pressed="false">
            <svg width="18" height="18" viewBox="0 0 256 256" aria-hidden="true"><path fill="currentColor" d="M234,80.12A24,24,0,0,0,216,72H160V48a40,40,0,0,0-40-40,8,8,0,0,0-7.16,4.42L75.06,88H32a16,16,0,0,0-16,16v88a16,16,0,0,0,16,16H204a24,24,0,0,0,23.82-21l12-96A24,24,0,0,0,234,80.12ZM32,104H72v88H32ZM223.94,97l-12,96a8,8,0,0,1-7.94,7H88V105.89l36.71-73.43A24,24,0,0,1,144,48V80a8,8,0,0,0,8,8h64a8,8,0,0,1,7.94,9Z"/></svg>
          </button>
        </div>
      </div>

      <!-- Tier 2: Deep Dive -->
      <div class="result__tier2" id="tier2">
        <div class="result__divider"><span>More about this spot</span></div>

        <div class="result__glyphs" id="glyphs"></div>
        <div class="result__google" id="google-rating" hidden></div>

        <div class="result__breakdown" id="breakdown">
          <h3 class="result__section-title">Match Breakdown</h3>
          <div class="result__factors" id="factors"></div>
          <p class="result__narrative" id="narrative"></p>
        </div>

        <div class="result__known" id="known-for" hidden>
          <h3 class="result__section-title">Known For</h3>
          <div class="result__pills" id="known-pills"></div>
        </div>

        <div class="result__details" id="details" hidden>
          <h3 class="result__section-title">Good to Know</h3>
          <dl class="result__detail-list" id="detail-list"></dl>
        </div>

        <div class="result__hours" id="hours" hidden>
          <h3 class="result__section-title">Hours</h3>
          <ul class="result__hours-list" id="hours-list"></ul>
        </div>

        <div class="result__contact" id="contact">
          <div class="result__contact-row" id="contact-row"></div>
        </div>

        <div class="result__start-over">
          <button class="result__start-over-btn" id="start-over-btn" type="button">Start over</button>
        </div>
      </div>
    </article>

    <!-- Bottom Sheets -->
    <div class="sheet" id="hood-sheet" role="dialog" aria-label="Choose neighborhood" hidden>
      <div class="sheet__backdrop" data-dismiss="sheet"></div>
      <div class="sheet__panel">
        <div class="sheet__header">
          <h3 class="sheet__title">Neighborhood</h3>
          <button class="sheet__close" data-dismiss="sheet" type="button" aria-label="Close">&times;</button>
        </div>
        <div class="sheet__body" id="hood-list"></div>
      </div>
    </div>

    <div class="sheet" id="dietary-sheet" role="dialog" aria-label="Dietary restrictions" hidden>
      <div class="sheet__backdrop" data-dismiss="sheet"></div>
      <div class="sheet__panel">
        <div class="sheet__header">
          <h3 class="sheet__title">Dietary</h3>
          <button class="sheet__close" data-dismiss="sheet" type="button" aria-label="Close">&times;</button>
        </div>
        <div class="sheet__body" id="dietary-list"></div>
      </div>
    </div>
  </main>

  <div class="sr-only" aria-live="polite" id="announce"></div>
  <div class="offline-banner" id="offline-banner" role="alert" aria-live="assertive" hidden>
    You're offline. Results may not load.
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
