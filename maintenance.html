<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Maintenance — DondeAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/command-center.css">
</head>
<body>

  <header class="cc-header">
    <div class="cc-header__left">
      <div class="cc-header__logo">
        <svg viewBox="0 0 32 44" width="18" height="25">
          <path d="M10.5 1 C10.5 1, 10 8.5, 12.5 11.5 Q14 13, 14.5 13.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M21.5 1 C21.5 1, 22 8.5, 19.5 11.5 Q18 13, 17.5 13.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M16 13.5 C22 11, 29 14, 28 21 C27 27, 19 29, 16 31 L16 34" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
          <circle cx="16" cy="40" r="2.8" fill="var(--cc-accent)"/>
        </svg>
        <span>Donde</span>
      </div>
      <div class="cc-header__title">Data Maintenance</div>
    </div>
    <div class="cc-header__right">
      <div class="cc-header__status">
        <span class="cc-header__dot" id="status-dot"></span>
        <span class="cc-header__status-text" id="status-text">Connected</span>
      </div>
      <a href="command-center.html" class="cc-header__back">Command Center</a>
    </div>
  </header>

  <div id="auth-gate" style="display:none">
    <div class="cc-auth">
      <h2 class="cc-auth__title">Access Denied</h2>
      <p class="cc-auth__message" id="auth-message">Sign in with your Google account to continue.</p>
      <button class="cc-btn cc-btn--primary" id="auth-sign-in">Sign in with Google</button>
    </div>
  </div>

  <main class="cc-main" id="main-content">
    <div id="maintenance-content">
      <div class="cc-loading"><div class="cc-spinner"></div>Loading database health...</div>
    </div>
  </main>

  <script src="js/cc-config.js"></script>
  <script src="js/cc-analytics.js"></script>
  <script>
    // Minimal init for maintenance page
    async function initMaintenance() {
      try {
        const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
        const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const { data: { session } } = await sb.auth.getSession();
        if (session?.user?.email === ADMIN_EMAIL) {
          loadMaintenanceSection();
        } else {
          const gate = document.getElementById('auth-gate');
          const msg = document.getElementById('auth-message');
          const btn = document.getElementById('auth-sign-in');
          gate.style.display = 'block';
          msg.textContent = session
            ? `Signed in as ${session.user.email} — admin access required.`
            : 'Sign in with your Google account to view maintenance.';
          btn.textContent = session ? 'Sign in with a different account' : 'Sign in with Google';
          btn.addEventListener('click', async () => {
            if (session) await sb.auth.signOut();
            await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } });
          });
        }
      } catch (e) {
        console.warn('Auth check failed:', e);
        loadMaintenanceSection();
      }
    }
    // Stub functions that cc-analytics.js expects but aren't on this page
    function addLog() {}
    function addNotification() {}
    function updateSystemStatus() {}
    function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    initMaintenance();
  </script>
</body>
</html>
